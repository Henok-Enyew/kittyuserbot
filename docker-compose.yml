# KittyUserbot
#
#   docker compose up -d --build     start (rebuilds after code changes)
#   docker compose logs -f           live logs (Ctrl+C to stop watching)
#   docker compose restart           restart the bot
#   docker compose down              stop it
#
# All settings and keys live in .env (copy .env.example to .env and fill it in).
# It uses the database in DATABASE_URL (e.g. Supabase). To run a local Postgres
# instead, set DATABASE_URL=postgresql://postgres:postgres@db/catuserbot and start
# with: docker compose --profile localdb up -d --build

services:
  kitty:
    build: .
    container_name: kittyuserbot
    env_file: .env
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:16-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catuserbot
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
